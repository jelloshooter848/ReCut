name: README media

# Regenerates docs/screenshots (README stills and demo GIFs) with scripts/readme-media.mjs, using excerpts of the
# Blender open movies Tears of Steel and Sintel (CC BY 3.0, see docs/screenshots/README.md), and commits the changed
# files back to the branch. The commit is pushed with GITHUB_TOKEN, so it does not start another run.
# The setup steps (system packages, Node, npm ci, FFmpeg, the speech-to-text engine) mirror the linux job of
# .github/workflows/windows.yml; keep them equivalent.
on:
  push:
    branches: [claude/readme-refresh]
    paths: [scripts/readme-media.mjs, .github/workflows/readme-media.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-media-${{ github.ref }}
  cancel-in-progress: true

env:
  TOS_URL: https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov
  TOS_SUBS_DIR: https://download.blender.org/demo/movies/ToS/subtitles/
  TOS_SUBS_NAMES: TOS-en.srt tos-en.srt TOS-EN.srt en.srt
  SINTEL_DIR: https://download.blender.org/durian/movies/
  SINTEL_NAMES: Sintel.2010.720p.mkv sintel-2048-stereo_720p.mkv
  SINTEL_SUBS_DIR: https://download.blender.org/durian/subs/
  SINTEL_SUBS_NAMES: sintel_en.srt Sintel_en.srt sintel-en.srt
  FOOTAGE: ${{ github.workspace }}/../readme-footage

jobs:
  media:
    name: Screenshots and demo GIFs
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # As in windows.yml (linux job): xvfb is required, the rest optional; each apt call is time-limited. Here the
      # optional set also has fonts-dejavu-core (the DVD subtitle bitmaps are drawn with DejaVu Sans).
      - name: System packages (xvfb; ninja-build, fonts-dejavu-core when the mirror allows)
        timeout-minutes: 12
        run: |
          set -u
          apt_opts='-o Acquire::Retries=2 -o Acquire::http::Timeout=20'
          apt_install() {
            timeout 150 sudo apt-get $apt_opts install -y --no-install-recommends "$@" ||
              { timeout 150 sudo apt-get $apt_opts update && timeout 150 sudo apt-get $apt_opts install -y --no-install-recommends "$@"; }
          }
          if ! dpkg -s xvfb > /dev/null 2>&1; then
            apt_install xvfb || { echo '::error::could not install xvfb'; exit 1; }
          fi
          optional='ninja-build fonts-dejavu-core'
          dpkg -s $optional > /dev/null 2>&1 || apt_install $optional ||
            echo "::warning::could not install all of: $optional (package mirror); continuing without the missing ones"
          echo "installed: $(dpkg-query -W -f='${Package} ${Version}, ' xvfb $optional 2> /dev/null)"
      - run: npm ci --no-audit --no-fund
      # Playwright's own FFmpeg build records the videos the GIFs are cut from.
      - name: Playwright video recorder
        run: npx playwright install ffmpeg

      - name: Download FFmpeg (and put it on PATH)
        run: |
          ./scripts/linux/get-ffmpeg.sh --dest resources/ffmpeg
          echo "$GITHUB_WORKSPACE/resources/ffmpeg" >> "$GITHUB_PATH"

      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-linux-ubuntu-22.04-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/linux/get-whisper.sh') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" NICE=0 ./scripts/linux/get-whisper.sh --dest resources/whisper

      # The footage, its English subtitles and the Whisper base.en model, cached by their URLs (and the model pin).
      - name: Footage cache key
        id: fkey
        run: |
          k="$(printf '%s\n' "$TOS_URL" "$TOS_SUBS_DIR" "$TOS_SUBS_NAMES" "$SINTEL_DIR" "$SINTEL_NAMES" "$SINTEL_SUBS_DIR" "$SINTEL_SUBS_NAMES" | sha256sum | cut -c1-16)"
          echo "key=readme-footage-$k-${{ hashFiles('shared/whisper.ts') }}" >> "$GITHUB_OUTPUT"
          mkdir -p "$FOOTAGE"
      - name: Footage cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FOOTAGE }}
          key: ${{ steps.fkey.outputs.key }}
      - name: Download the footage, subtitles and Whisper model
        run: |
          set -uo pipefail
          cd "$FOOTAGE"
          # get <dest> <url>...: the first URL that downloads; on failure print the listing of the first one's folder.
          get() {
            local dest="$1"; shift
            if [ -s "$dest" ]; then echo "cached: $dest ($(stat -c %s "$dest") bytes)"; return 0; fi
            for u in "$@"; do
              echo "trying $u"
              if curl -fSL --retry 3 --retry-delay 5 -o "$dest.part" "$u"; then mv "$dest.part" "$dest"; echo "got $dest ($(stat -c %s "$dest") bytes)"; return 0; fi
            done
            rm -f "$dest.part"
            local parent="${1%/*}/"
            echo "::error::could not download $dest; listing of $parent:"
            curl -fsSL "$parent" | grep -o 'href="[^"]*"' | sed 's/href="//; s/"$//' | head -n 80 || echo "(no listing)"
            return 1
          }
          urls() { local dir="$1"; shift; for n in "$@"; do printf '%s ' "$dir$n"; done; }
          ok=0
          get tos.mov "$TOS_URL" || ok=1
          get tos-en.srt $(urls "$TOS_SUBS_DIR" $TOS_SUBS_NAMES) || ok=1
          get sintel.mkv $(urls "$SINTEL_DIR" $SINTEL_NAMES) || ok=1
          get sintel-en.srt $(urls "$SINTEL_SUBS_DIR" $SINTEL_SUBS_NAMES) || ok=1
          # Whisper base.en from the pinned Hugging Face revision ReCut itself downloads from (shared/whisper.ts).
          rev="$(sed -n "s/^export const WHISPER_MODELS_REVISION = '\([0-9a-f]\{40\}\)';$/\1/p" "$GITHUB_WORKSPACE/shared/whisper.ts")"
          sha="$(grep "id: 'base.en'," "$GITHUB_WORKSPACE/shared/whisper.ts" | sed -n "s/.*sha256: '\([0-9a-f]\{64\}\)'.*/\1/p")"
          if [ -z "$rev" ] || [ -z "$sha" ]; then echo '::error::could not read the base.en model pin from shared/whisper.ts'; ok=1
          else
            if ! echo "$sha  ggml-base.en.bin" | sha256sum -c --quiet 2>/dev/null; then
              rm -f ggml-base.en.bin
              get ggml-base.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/$rev/ggml-base.en.bin" || ok=1
              echo "$sha  ggml-base.en.bin" | sha256sum -c || ok=1
            fi
          fi
          ls -la
          for f in tos.mov sintel.mkv; do [ -s "$f" ] && ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,channels -of compact "$f"; done
          for f in tos-en.srt sintel-en.srt; do [ -s "$f" ] && { echo "== $f"; head -n 12 "$f"; }; done
          exit $ok

      - run: npm run build
      - name: Capture (xvfb)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/readme-media.mjs --media "$FOOTAGE" --out docs/screenshots --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-media
          path: docs/screenshots/
          if-no-files-found: ignore

      - name: Commit the changed screenshots
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/screenshots)" ]; then echo 'docs/screenshots unchanged'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/screenshots
          git commit -m 'README media: regenerate screenshots and demos (CI)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
