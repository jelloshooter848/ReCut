name: Windows build

# Builds the Windows installer + portable exe on a real Windows machine, smoke-tests them, runs the unit and
# end-to-end suites on Windows, checks that "Start ReCut.cmd" works from a fresh clone, keeps the installers as the
# run's ReCut-windows artifact, and publishes a GitHub Release when the run is a real release. The same workflow
# builds and gates the Linux x86-64 AppImage (job linux, artifact ReCut-linux) and the two macOS dmgs (jobs macos and
# macos-e2e, artifacts ReCut-macos-arm64 and ReCut-macos-x64): the file name stays windows.yml and the display name
# "Windows build" because docs and bookmarks point to them.
#
# Job graph (the required gates run in parallel on every run; publishing is a separate final job):
#   installer  build, smoke test, install check, upload the ReCut-windows artifact (every run) and, on a release run,
#              the release-notes artifact, and decide the release metadata (job outputs)
#   tests      unit tests (vitest) on Windows
#   e2e        end-to-end tests (Playwright + Electron) on Windows
#   launcher   "Start ReCut.cmd" self-test from a fresh clone
#   linux      on ubuntu-22.04: typecheck, unit tests and the e2e suite (xvfb) with the bundled FFmpeg and speech-to-text
#              engine, the x86-64 AppImage (scripts/linux/get-ffmpeg.sh bundles FFmpeg and its licence files,
#              scripts/linux/get-whisper.sh builds whisper.cpp), an AppImage smoke test (FUSE-mounted and
#              --appimage-extract-and-run), and the ReCut-linux artifact (every run)
#   macos      a matrix over arch [arm64, x64], both on macos-14 (Apple Silicon; the x64 leg runs its binaries under
#              Rosetta 2): typecheck, unit tests with the bundled FFmpeg of that arch (scripts/mac/get-ffmpeg.sh --arch)
#              and speech-to-text engine (scripts/mac/get-whisper.sh --arch), the dmg of that arch (Developer ID signed
#              and notarized when the signing secrets are set, ad-hoc signed otherwise; a release run fails unless it
#              is signed and notarized), code-signature checks, a smoke test of the app inside the mounted dmg, and the
#              ReCut-macos-arm64 / ReCut-macos-x64 artifacts (every run)
#   macos-e2e  the end-to-end suite on macos-14 (arm64 only)
#   publish    needs installer, tests, e2e, launcher, linux, macos (both legs) and macos-e2e. Runs only on a real
#              release run (installer output release == 'true') and only when all of them succeeded (default
#              success() semantics: a failed, cancelled or skipped gate skips it), then checks the release files,
#              re-checks the tag and publishes the release from the installer job's outputs and the ReCut-windows,
#              ReCut-linux, ReCut-macos-arm64, ReCut-macos-x64 and release-notes artifacts.
#   installer-stress  manual only, not a gate (see below).
# The speech-to-text engine (whisper.cpp, docs/ROADMAP.md §5) is compiled from its pinned, hash-checked source by
# scripts/windows/get-whisper.ps1, scripts/linux/get-whisper.sh and scripts/mac/get-whisper.sh in every job that bundles or tests it, cached per
# pinned source and build script (actions/cache), so a cache hit skips the compile.
# Every gate is required: none has continue-on-error. A red gate means nothing is published and no tag is created;
# fix the problem and push again (docs/RELEASING.md).
#
# Only real versions (vX.Y.Z) ever appear on the Releases page (owner's decision, 7 October 2026): there are no dev
# prereleases. The one kind of pre-release is a release candidate such as v1.0.0-rc.1: a real version, with its own
# package.json version and CHANGELOG.md section, published like any release but marked pre-release and never
# Latest (docs/RELEASING.md, Release candidates). Every other run is a test build: it runs every gate the same way
# and keeps the installer and portable exe as the run's ReCut-windows artifact, the AppImage as its ReCut-linux
# artifact and the dmgs as its ReCut-macos-arm64 / ReCut-macos-x64 artifacts (Actions -> the run -> Artifacts), but
# creates no tag and no release.
#
# Releases are automatic (docs/RELEASING.md). The normal flow is: a release PR bumps package.json
# (npm version X.Y.Z --no-git-tag-version) and adds a "## [X.Y.Z]" section to CHANGELOG.md -> the PR is merged ->
# this workflow runs on the push to main and, after every gate passes, the publish job publishes release vX.Y.Z on
# the merge commit. Nobody pushes a tag: the publish job creates it. Never create the release or tag by hand (for
# example in the GitHub web UI) before the release PR is merged.
#
# Release or test build, decided by the "Release metadata" step:
#   - push to main, package.json version v has a "## [v]" CHANGELOG.md section, and no tag v<v> exists on origin:
#                                  release v<v>  "ReCut <v>", marked Latest, notes from CHANGELOG.md   (auto == 'true')
#     When v has a SemVer pre-release part (1.0.0-rc.1, section "## [1.0.0-rc.1]"), the release is marked
#     pre-release and NOT Latest (prerelease == 'true'); the files and the gates are the same.
#   - push of a tag v<MAJOR.MINOR.PATCH> or v<MAJOR.MINOR.PATCH>-rc.<N> (optional manual fallback): the same
#     release. The tag must equal "v" + package.json version, and CHANGELOG.md must have a "## [<version>]" section, or the run fails in seconds.
#   - anything else (push to main when v<v> is already tagged or has no changelog section, other branches,
#     workflow_dispatch): test build. The publish job is skipped; the installers are only the run's ReCut-windows
#     artifact, and the installer job's summary says where to download them.
#   Just before publishing, the publish job re-checks that an automatic release's v<v> is still untagged (someone may
#   have pushed the tag while this run was building). If it is tagged, the job logs a warning that v<v> is already
#   released, publishes nothing and succeeds.
#
# Trigger notes:
#   - Only plain semver tags (v0.2.0, v1.10.3) and release-candidate tags (v1.0.0-rc.1) trigger a tag build. GitHub
#     filter patterns treat '.' and '-' literally and '+' as "one or more of the preceding character", so the old
#     v*-dev.* / v*-win.* prerelease tags never match.
#   - The release tag this workflow creates itself (the automatic v<v> on main) is created by
#     softprops/action-gh-release with GITHUB_TOKEN. GitHub never starts a workflow run for events caused by
#     GITHUB_TOKEN, so an automatic release does not trigger a second (tag) build of the same commit.
#   - paths-ignore applies to branch pushes only: GitHub does not evaluate path filters for tag pushes, so a release
#     tag on a commit that changed only CHANGELOG.md / docs still builds. A push to main that changes only *.md /
#     docs/** does not run at all, so it cannot release; a release PR always changes package.json, so it does.
on:
  push:
    branches: [claude/build-recut, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      installer_stress:
        description: 'Also run the installer-stress job: the install check on 6 extra runners (10 install cycles each)'
        type: boolean
        default: false

permissions:
  contents: write

# One run per ref at a time. Other branches cancel a superseded run. Runs on main are never cancelled by a newer
# push: they queue, because a main run may be the one publishing a release, and cancelling it (two quick merges)
# would drop the release or let it race the next run. Queueing also serialises the "is v<v> already tagged?" check,
# so the second run sees the tag the first one created and makes a test build. (GitHub keeps at most one pending
# run per group: a newer push replaces a still-pending one. If that drops a not-yet-started release run, the newer
# run releases instead, since v<v> is still untagged and its package.json/CHANGELOG.md still carry v<v>.)
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  installer:
    name: Installer + portable exe
    runs-on: windows-latest
    timeout-minutes: 60
    # What the publish job needs. release is 'true' only for a real release (automatic on main, or the tag-push
    # fallback); the publish job runs only then. prerelease is 'true' when the version has a SemVer pre-release part
    # (a release candidate such as 1.0.0-rc.1): published as a pre-release, never marked Latest. notes is the file
    # name inside the release-notes artifact (a file does not cross jobs, so the notes travel as an artifact and stay
    # byte-identical).
    outputs:
      release: ${{ steps.rel.outputs.release }}
      auto: ${{ steps.rel.outputs.auto }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
      tag: ${{ steps.rel.outputs.tag }}
      name: ${{ steps.rel.outputs.name }}
      notes: ${{ steps.rel.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      # Runs first so a mistagged release fails in seconds, not after the build. Publishing happens only in the
      # separate publish job, only on a release run, and only after this job and every test job have passed.
      - name: Release metadata (release or test build, changelog notes)
        id: rel
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false   # git ls-remote exit codes are checked by hand
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # MAJOR.MINOR.PATCH, or a SemVer pre-release MAJOR.MINOR.PATCH-<pre> such as 1.0.0-rc.1 (a release candidate,
          # docs/RELEASING.md). No leading zeros, no build metadata (+...).
          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ($v -cnotmatch $semver) { Write-Host "::error::package.json version '$v' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE (for example 1.0.0-rc.1)"; exit 1 }
          # A pre-release (release candidate) is published as a pre-release and never marked Latest.
          $prerelease = if ($v.Contains('-')) { 'true' } else { 'false' }
          $core = ($v -split '-', 2)[0]
          $install = @(
            "**ReCut-Setup-$v.exe** — installer. Adds Start-menu and desktop shortcuts, opens ``.recut`` projects, and can be removed from *Settings › Apps*.",
            "**ReCut-Portable-$v.exe** — no install; double-click to run (starts a little slower).",
            "**ReCut-$v-linux-x86_64.AppImage** — Linux, x86-64 only; no install. Make it executable and run it: ``chmod +x ReCut-$v-linux-x86_64.AppImage``, then ``./ReCut-$v-linux-x86_64.AppImage``. If it reports that FUSE is missing, install ``libfuse2`` (``libfuse2t64`` on Ubuntu 24.04 and later) or run it with ``--appimage-extract-and-run``.",
            "**ReCut-$v-macos-arm64.dmg** (Apple Silicon: *About This Mac* says ""Chip: Apple M…"") or **ReCut-$v-macos-x64.dmg** (Intel: ""Processor: … Intel"") — macOS 12 or later. Signed and notarized: open the dmg and drag ReCut to Applications.",
            '',
            'FFmpeg is bundled in every download, so nothing else needs to be installed. The Windows app is not code-signed: if',
            'Windows shows "Windows protected your PC", click **More info › Run anyway**.',
            '',
            "Built from $env:SHA. This build launched, encoded and probed a test clip on Windows, Linux and macOS runners before publishing."
          ) -join "`n"

          # The "## [<ver>]" section of CHANGELOG.md, from its heading to the next "## [" heading (or a link-reference
          # block / end of file). $null if there is no such heading, '' if the section is empty.
          function Get-ChangelogSection([string]$ver) {
            $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
            $head = '^## \[' + [regex]::Escape($ver) + '\](\s|$)'
            $start = -1; $end = $lines.Count
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($start -lt 0) { if ($lines[$i] -match $head) { $start = $i } }
              elseif ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[[^\]]+\]:\s') { $end = $i; break }
            }
            if ($start -lt 0) { return $null }
            if ($end - $start -lt 2) { return '' }
            return ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          }
          # Release body: the changelog section, then the install note. Repository-relative links (bugs/closed/...)
          # do not resolve in a release body, so they are pointed at the release tag. A pre-release starts with a note
          # saying what it is.
          $preNote = "**Pre-release: a release candidate of ReCut $core, for testing.** It is not the latest stable release (that is the one marked **Latest**). ReCut's update notice tells people running an earlier candidate of $core about it, and nobody else."
          function Get-ReleaseBody([string]$section, [string]$tag) {
            $section = [regex]::Replace($section, '\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#|/)([^)\s]+)\)', "](https://github.com/$env:REPO/blob/$tag/`$1)")
            if ($prerelease -eq 'true') { $section = "$preNote`n`n$section" }
            return "$section`n`n---`n`n$install"
          }
          # Whether tag $tag exists on origin (actions/checkout left its credentials in the git config).
          # ls-remote --exit-code exits 2 when no ref matches. Any other failure stops the run rather than guess,
          # because guessing "not tagged" could publish onto an existing release.
          function Test-RemoteTag([string]$tag) {
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Host
            $rc = $LASTEXITCODE
            $global:LASTEXITCODE = 0   # the runner fails a pwsh step whose script ends with a non-zero LASTEXITCODE
            if ($rc -eq 0) { return $true }
            if ($rc -eq 2) { return $false }
            Write-Host "::error::git ls-remote failed (exit $rc) while checking whether tag $tag exists."; exit 1
          }

          # Default: test build. Nothing is published and no tag is created; the installers are only the run's
          # ReCut-windows artifact.
          $tag = ''; $name = "ReCut $v test build (run $env:RUN_NUMBER)"; $body = $null; $release = 'false'; $auto = 'false'

          if ($env:REF_TYPE -eq 'tag') {
            # Manual fallback: a pushed tag vX.Y.Z must match package.json and have a changelog section.
            if ($env:REF_NAME -cne "v$v") {
              Write-Host "::error::Tag '$env:REF_NAME' does not match package.json version '$v' (expected tag 'v$v'). Tag the merge commit of the release PR that bumped package.json, or fix the version in a new release PR. See docs/RELEASING.md."
              exit 1
            }
            $section = Get-ChangelogSection $v
            if ($null -eq $section) { Write-Host "::error::CHANGELOG.md has no '## [$v]' section. Add it in the release PR (see docs/RELEASING.md)."; exit 1 }
            if (-not $section) { Write-Host "::error::The '## [$v]' section of CHANGELOG.md is empty."; exit 1 }
            $tag = "v$v"; $name = "ReCut $v"; $body = Get-ReleaseBody $section $tag; $release = 'true'
          } elseif ($env:EVENT_NAME -eq 'push' -and $env:REF -eq 'refs/heads/main') {
            # Automatic release: the first main build of a version that has a changelog section and no tag yet.
            $section = Get-ChangelogSection $v
            if (-not $section) {
              Write-Host "CHANGELOG.md has no (or an empty) '## [$v]' section: test build."
            } elseif (Test-RemoteTag "v$v") {
              Write-Host "Tag v$v already exists on origin ($v is released): test build."
            } else {
              Write-Host "v$v is not tagged yet and CHANGELOG.md has its section: publishing release v$v from $env:SHA."
              $tag = "v$v"; $name = "ReCut $v"; $body = Get-ReleaseBody $section $tag; $release = 'true'; $auto = 'true'
            }
          }

          # A release run writes its notes into a directory that is uploaded as the release-notes artifact for the
          # publish job; the notes output is the file name inside that directory (and artifact). A test build has
          # no notes and uploads no release-notes artifact.
          $notesDir = Join-Path $env:RUNNER_TEMP 'release-notes'
          if ($release -eq 'true') {
            New-Item -ItemType Directory -Force -Path $notesDir | Out-Null
            $notes = Join-Path $notesDir 'release-notes.md'
            Set-Content -Path $notes -Value $body -Encoding utf8
            Write-Host "Release: $name (tag $tag, automatic $auto, pre-release $prerelease)"; Get-Content $notes
          } else {
            Write-Host "Test build: $name. Nothing is published; the installers are this run's ReCut-windows artifact."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value @(
            "version=$v", "release=$release", "auto=$auto", "prerelease=$prerelease", "tag=$tag", "name=$name", "notes=release-notes.md",
            "notes_dir=$notesDir")
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

      - name: Download FFmpeg to bundle
        shell: pwsh
        run: ./scripts/windows/get-ffmpeg.ps1 -Dest resources/ffmpeg

      # The speech-to-text engine (whisper.cpp), bundled like FFmpeg (resources/whisper -> <resources>/whisper). Built from
      # the pinned, hash-checked source; cached per pinned source and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-windows-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/windows/get-whisper.ps1') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/windows/get-whisper.ps1 -Dest resources/whisper -Jobs 4

      - name: Build app and Windows packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never

      # OCR packaging (tests/unit/ocr-packaging.test.ts checks the config side): the OCR worker and the two LSTM-only
      # Tesseract cores are unpacked from app.asar and must fit a 7 MB budget, and the tesseract.js / tesseract.js-core
      # packages (45 MB with every core variant) must not be in app.asar.
      - name: OCR packaging budget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false   # npx's exit code is checked by hand
          $dir = 'release/win-unpacked/resources/app.asar.unpacked/dist/electron/ocr'
          if (-not (Test-Path "$dir/worker.js")) { throw "OCR worker is not unpacked: $dir/worker.js" }
          $files = @(Get-ChildItem -Recurse -File $dir)
          $root = (Resolve-Path $dir).Path
          $files | ForEach-Object { Write-Host ('{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($root.Length + 1)) }
          $bytes = ($files | Measure-Object -Sum Length).Sum
          Write-Host ('OCR folder: {0:N0} bytes ({1:N2} MB, budget 7 MB)' -f $bytes, ($bytes / 1MB))
          if ($bytes -gt 7MB) { throw "OCR folder is $bytes bytes, over the 7 MB budget" }
          $list = @(npx asar list release/win-unpacked/resources/app.asar)
          if ($LASTEXITCODE -ne 0 -or $list.Count -eq 0) { throw 'npx asar list failed' }
          $bad = @($list | Where-Object { $_ -match '[\\/]node_modules[\\/]tesseract\.js(-core)?([\\/]|$)' })
          if ($bad.Count -gt 0) { $bad | Select-Object -First 10 | ForEach-Object { Write-Host $_ }; throw 'app.asar contains tesseract.js or tesseract.js-core' }
          Write-Host "app.asar: $($list.Count) entries, no tesseract.js / tesseract.js-core"

      # The speech-to-text engine in the package: whisper-cli.exe with its DLLs, licence and build record, within a
      # 16 MB budget (about 10 MB today: the engine, ggml and five CPU-variant kernels; no model is ever bundled).
      - name: Speech-to-text packaging budget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'release/win-unpacked/resources/whisper'
          foreach ($f in @('whisper-cli.exe', 'whisper.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu-x64.dll', 'WHISPER-LICENSE.txt', 'WHISPER-BUILD.txt')) {
            if (-not (Test-Path "$dir/$f")) { throw "speech-to-text engine file missing: $dir/$f" }
          }
          $files = @(Get-ChildItem -File $dir)
          $files | ForEach-Object { Write-Host ('{0,12:N0}  {1}' -f $_.Length, $_.Name) }
          $bytes = ($files | Measure-Object -Sum Length).Sum
          Write-Host ('Speech-to-text engine: {0:N0} bytes ({1:N2} MB, budget 16 MB)' -f $bytes, ($bytes / 1MB))
          if ($bytes -gt 16MB) { throw "speech-to-text engine folder is $bytes bytes, over the 16 MB budget" }
          if (@(Get-ChildItem -File $dir -Filter '*.bin').Count) { throw 'a model file is in the package' }
          Get-Content "$dir/WHISPER-BUILD.txt" -TotalCount 12

      - name: Smoke-test the unpacked app
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\smoke-unpacked.txt"
          $env:RECUT_SMOKE = '1'; $env:RECUT_SMOKE_OUT = $out; $env:RECUT_USER_DATA = "$env:RUNNER_TEMP\ud1"
          $p = Start-Process -FilePath release/win-unpacked/ReCut.exe -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'smoke test timed out' }
          Get-Content $out
          $r = Get-Content $out -Raw
          # "ocr core=<variant> ok worker=<path>": the OCR worker started from app.asar.unpacked and loaded the Tesseract core.
          # "whisper engine=<version> ok path=<path>": the bundled whisper-cli.exe ran (--version, no model needed).
          if ($r -cmatch 'FAILED|layout=MISSING' -or $r -notmatch 'encode\+probe ok' -or $r -notmatch 'status=206' -or $r -notmatch 'resources\\ffmpeg' -or $r -notmatch 'ocr core=(relaxedsimd-lstm|lstm) ok worker=.*app\.asar\.unpacked' -or $r -notmatch 'whisper engine=[0-9.]+ ok path=.*resources\\whisper\\whisper-cli\.exe') { throw 'smoke test failed' }

      # Uploaded on every run (release or test build), before the install check so a failed install can still be
      # inspected, and so the installer-stress and publish jobs can reuse the build. On a test build this artifact is
      # the only place the installers go. The artifact root is release/ (the files' common folder), so downloading it
      # into release/ restores release/ReCut-Setup-*.exe and release/ReCut-Portable-*.exe, the files the publish job
      # attaches. A release is published only after the install check and every test job pass. Kept 14 days so test
      # builds do not pile up (a release keeps its files on the Releases page).
      - uses: actions/upload-artifact@v4
        with:
          name: ReCut-windows
          path: |
            release/ReCut-Setup-*.exe
            release/ReCut-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

      # The notes file written by the "Release metadata" step (release-notes.md), for the publish job. Release runs
      # only: a test build has no notes and no publish job.
      - uses: actions/upload-artifact@v4
        if: steps.rel.outputs.release == 'true'
        with:
          name: release-notes
          path: ${{ steps.rel.outputs.notes_dir }}
          if-no-files-found: error
          retention-days: 14

      # A test build is not published anywhere: tell whoever opens the run where its installers are.
      - name: Test build summary
        if: steps.rel.outputs.release != 'true'
        shell: pwsh
        env:
          NAME: ${{ steps.rel.outputs.name }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @(
            "**Test build: download the installers from this run's Artifacts (ReCut-windows).**",
            '',
            "$env:NAME is not a release: nothing is published to GitHub Releases and no tag is created. Use it only if the required jobs of this run (installer, tests, e2e, launcher, linux, macos, macos-e2e) are green. The artifact is kept for 14 days.")

      # Five silent install / smoke / uninstall cycles plus one portable launch, because the installer crash in
      # bugs/closed/2026-10-05-nsis-installer-crash-system-dll.md was intermittent. Prints the CPU first and, on a
      # failed install, the faulting module (Application error events) and the NSIS temp dir.
      - name: Install check (installer x5, uninstall, portable exe)
        shell: pwsh
        run: ./scripts/windows/install-check.ps1 -Release release -Attempts 5 -SmokeAttempts 1

  # Manual only (workflow_dispatch with installer_stress): repeats the install check on several runners to raise the
  # chance of landing on the host types where the intermittent NSIS installer crash showed up (AMD EPYC 7763), see
  # bugs/closed/2026-10-05-nsis-installer-crash-system-dll.md. Reuses the installer job's build; never on push/tag.
  installer-stress:
    name: Installer stress ${{ matrix.shard }}
    needs: installer
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.installer_stress }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReCut-windows
          path: release
      - name: Install check (installer x10, uninstall, portable exe)
        shell: pwsh
        run: ./scripts/windows/install-check.ps1 -Release release -Attempts 10 -SmokeAttempts 1

  launcher:
    name: Start ReCut.cmd from a fresh clone
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the launcher in self-test mode
        shell: cmd
        run: call "Start ReCut.cmd" -Smoke

  tests:
    name: Unit tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Put FFmpeg on PATH
        shell: pwsh
        run: |
          ./scripts/windows/get-ffmpeg.ps1 -Dest "$env:RUNNER_TEMP\ff"
          "$env:RUNNER_TEMP\ff" >> $env:GITHUB_PATH
      # tests/unit/whisper-job.test.ts runs the real engine (resources/whisper) with a generated model.
      # The speech-to-text engine (whisper.cpp), bundled like FFmpeg (resources/whisper -> <resources>/whisper). Built from
      # the pinned, hash-checked source; cached per pinned source and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-windows-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/windows/get-whisper.ps1') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/windows/get-whisper.ps1 -Dest resources/whisper -Jobs 4
      - run: npx vitest run

  e2e:
    name: End-to-end tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Put FFmpeg and Git Bash on PATH
        shell: pwsh
        run: |
          ./scripts/windows/get-ffmpeg.ps1 -Dest "$env:RUNNER_TEMP\ff"
          "$env:RUNNER_TEMP\ff" >> $env:GITHUB_PATH
          'C:\Program Files\Git\bin' >> $env:GITHUB_PATH
      # tests/e2e/whisper.spec.ts transcribes with the engine the app finds in resources/whisper.
      # The speech-to-text engine (whisper.cpp), bundled like FFmpeg (resources/whisper -> <resources>/whisper). Built from
      # the pinned, hash-checked source; cached per pinned source and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-windows-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/windows/get-whisper.ps1') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/windows/get-whisper.ps1 -Dest resources/whisper -Jobs 4
      - run: npm run build
      - run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-windows
          path: test-results/

  # The Linux release gate (docs/ROADMAP.md §19): unit tests, the e2e suite under xvfb, the x86-64 AppImage with a
  # bundled FFmpeg, and a smoke test of the AppImage itself. Required like the Windows gates: publish needs it.
  # Pinned to ubuntu-22.04, not ubuntu-latest: the gate tests on the older of the two supported Ubuntu LTS releases
  # (glibc 2.35 and GTK / NSS of that age), so a dependency on something newer shows up here rather than on users'
  # machines; the image does not change when GitHub moves ubuntu-latest; and it has the libfuse2 package the AppImage
  # runtime loads (24.04 renamed it libfuse2t64). The bundled FFmpeg needs only glibc 2.28 or newer
  # (scripts/linux/get-ffmpeg.sh checks its linkage and records it in FFMPEG-BUILD.txt). Move to the next LTS image
  # before GitHub retires ubuntu-22.04.
  linux:
    name: Linux AppImage + tests
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # xvfb (on the GitHub image already) is required: headless Electron for the e2e and smoke tests. The rest is
      # optional: libfuse2 for the AppImage's mounted smoke run, ninja-build to compile the speech-to-text engine faster
      # (get-whisper.sh falls back to make), espeak-ng for the speech the real-model test hears (it falls back to a tone).
      # The Ubuntu package mirror has stalled (runs #108 and #110 hung for over 10 minutes), so a mirror problem must not
      # block a release: each apt call is time-limited, and when libfuse2 cannot be installed the smoke test runs the
      # AppImage extracted only, with a warning. The mounted run is FUSE's own loader and identical for every AppImage;
      # the extracted run exercises everything ReCut ships.
      - name: System packages (xvfb; libfuse2, ninja-build, espeak-ng when the mirror allows)
        timeout-minutes: 12
        run: |
          set -u
          apt_opts='-o Acquire::Retries=2 -o Acquire::http::Timeout=20'
          apt_install() {
            timeout 150 sudo apt-get $apt_opts install -y --no-install-recommends "$@" ||
              { timeout 150 sudo apt-get $apt_opts update && timeout 150 sudo apt-get $apt_opts install -y --no-install-recommends "$@"; }
          }
          if ! dpkg -s xvfb > /dev/null 2>&1; then
            apt_install xvfb || { echo '::error::could not install xvfb'; exit 1; }
          fi
          optional='libfuse2 ninja-build espeak-ng'
          dpkg -s $optional > /dev/null 2>&1 || apt_install $optional ||
            echo "::warning::could not install all of: $optional (package mirror); continuing without the missing ones"
          if dpkg -s libfuse2 > /dev/null 2>&1; then
            echo 'APPIMAGE_FUSE=1' >> "$GITHUB_ENV"
          else
            echo '::warning::libfuse2 could not be installed (package mirror); the AppImage smoke test runs extracted only'
            echo 'APPIMAGE_FUSE=0' >> "$GITHUB_ENV"
          fi
          echo "installed: $(dpkg-query -W -f='${Package} ${Version}, ' xvfb $optional 2> /dev/null)"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

      # The same build is bundled into the AppImage (resources/ffmpeg -> <resources>/ffmpeg) and put on PATH for the
      # unit and e2e tests, so the tests exercise the FFmpeg users get. The app run from the checkout also finds it as
      # resources/ffmpeg in its working directory.
      - name: Download FFmpeg to bundle (and put it on PATH)
        run: |
          ./scripts/linux/get-ffmpeg.sh --dest resources/ffmpeg
          echo "$GITHUB_WORKSPACE/resources/ffmpeg" >> "$GITHUB_PATH"

      # The speech-to-text engine (whisper.cpp), bundled into the AppImage (resources/whisper -> <resources>/whisper) and
      # used by the unit, e2e and smoke tests. Built from the pinned, hash-checked source on this image (so its glibc
      # floor is the gate's); cached per pinned source and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-linux-ubuntu-22.04-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/linux/get-whisper.sh') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" NICE=0 ./scripts/linux/get-whisper.sh --dest resources/whisper

      # The pinned tiny model (78 MB, the only model CI ever downloads), for the real-recognition test in
      # tests/unit/whisper-job.test.ts. Cached by its SHA-256; checked against it after every download or restore.
      - name: Tiny Whisper model for the tests (cache)
        id: tiny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/recut-ci/ggml-tiny.bin
          key: whisper-model-tiny-${{ hashFiles('shared/whisper.ts') }}
      - name: Tiny Whisper model for the tests
        run: |
          set -euo pipefail
          rev="$(sed -n "s/^export const WHISPER_MODELS_REVISION = '\([0-9a-f]\{40\}\)';$/\1/p" shared/whisper.ts)"
          sha="$(grep "id: 'tiny'," shared/whisper.ts | sed -n "s/.*sha256: '\([0-9a-f]\{64\}\)'.*/\1/p")"
          test -n "$rev" && test -n "$sha" || { echo '::error::could not read the tiny model pin from shared/whisper.ts'; exit 1; }
          f="$HOME/.cache/recut-ci/ggml-tiny.bin"
          mkdir -p "$(dirname "$f")"
          if ! echo "$sha  $f" | sha256sum -c --quiet 2>/dev/null; then
            curl -fsSL --retry 3 -o "$f" "https://huggingface.co/ggerganov/whisper.cpp/resolve/$rev/ggml-tiny.bin"
            echo "$sha  $f" | sha256sum -c
          fi
          echo "RECUT_WHISPER_TINY_MODEL=$f" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npx vitest run

      # Timeline interchange (FCPXML / OTIO / EDL, shared/interchange): the goldens the unit tests just checked, read
      # back by an independent reader, OpenTimelineIO with its cmx_3600 and fcpx_xml adapters (pinned). A format whose
      # adapter is missing is reported and skipped by the script.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interchange exports read back with OpenTimelineIO
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --quiet opentimelineio==0.18.1 otio-cmx3600-adapter==1.0.0 otio-fcpx-xml-adapter==1.0.0
          python scripts/interchange-check.py

      - run: npm run build
      - name: End-to-end tests (xvfb)
        run: xvfb-run -a npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-linux
          path: test-results/

      - name: Package the AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      # Same budget as the Windows job: the OCR worker and the LSTM-only Tesseract cores are unpacked from app.asar and
      # fit 7 MB, and tesseract.js / tesseract.js-core are not in app.asar.
      - name: OCR packaging budget
        run: |
          set -euo pipefail
          dir=release/linux-unpacked/resources/app.asar.unpacked/dist/electron/ocr
          test -f "$dir/worker.js" || { echo "::error::OCR worker is not unpacked: $dir/worker.js"; exit 1; }
          find "$dir" -type f -printf '%12s  %P\n'
          bytes=$(find "$dir" -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          echo "OCR folder: $bytes bytes (budget 7 MB)"
          if [ "$bytes" -gt $((7 * 1024 * 1024)) ]; then echo "::error::OCR folder is $bytes bytes, over the 7 MB budget"; exit 1; fi
          npx asar list release/linux-unpacked/resources/app.asar > "$RUNNER_TEMP/asar-list.txt"
          test -s "$RUNNER_TEMP/asar-list.txt" || { echo '::error::npx asar list failed'; exit 1; }
          if grep -E '/node_modules/tesseract\.js(-core)?(/|$)' "$RUNNER_TEMP/asar-list.txt" > "$RUNNER_TEMP/asar-bad.txt"; then
            head -n 10 "$RUNNER_TEMP/asar-bad.txt"; echo '::error::app.asar contains tesseract.js or tesseract.js-core'; exit 1
          fi
          echo "app.asar: $(wc -l < "$RUNNER_TEMP/asar-list.txt") entries, no tesseract.js / tesseract.js-core"

      # The speech-to-text engine that went into the AppImage: whisper-cli and its libraries, the licence and the build
      # record, within a 16 MB budget (about 10 MB today), linked only to glibc and its own libraries, no model.
      - name: Speech-to-text packaging budget
        run: |
          set -euo pipefail
          dir=release/linux-unpacked/resources/whisper
          ls -la "$dir"
          test -x "$dir/whisper-cli" || { echo "::error::$dir/whisper-cli is missing or not executable"; exit 1; }
          for f in WHISPER-LICENSE.txt WHISPER-BUILD.txt libggml-cpu-x64.so; do test -s "$dir/$f" || { echo "::error::$dir/$f is missing or empty"; exit 1; }; done
          if ldd "$dir/whisper-cli" | grep -q 'not found'; then ldd "$dir/whisper-cli"; echo '::error::whisper-cli has an unresolved library'; exit 1; fi
          if ls "$dir"/*.bin >/dev/null 2>&1; then echo '::error::a model file is in the package'; exit 1; fi
          bytes=$(find "$dir" -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          echo "Speech-to-text engine: $bytes bytes (budget 16 MB)"
          if [ "$bytes" -gt $((16 * 1024 * 1024)) ]; then echo "::error::the speech-to-text engine is $bytes bytes, over the 16 MB budget"; exit 1; fi
          sed -n '1,14p' "$dir/WHISPER-BUILD.txt"

      # The FFmpeg folder that went into the AppImage: both programs, the licence and the build record (the BtbN Linux
      # builds have no readme, so FFMPEG-README.txt is optional, as in get-ffmpeg.sh).
      - name: Bundled FFmpeg files
        run: |
          set -euo pipefail
          ff=release/linux-unpacked/resources/ffmpeg
          ls -la "$ff"
          for f in ffmpeg ffprobe; do test -x "$ff/$f" || { echo "::error::$ff/$f is missing or not executable"; exit 1; }; done
          for f in FFMPEG-LICENSE.txt FFMPEG-BUILD.txt; do test -s "$ff/$f" || { echo "::error::$ff/$f is missing or empty"; exit 1; }; done
          grep -q '^Platform: *x86-64 Linux$' "$ff/FFMPEG-BUILD.txt" || { echo '::error::FFMPEG-BUILD.txt does not name the x86-64 Linux platform'; exit 1; }
          grep -q '^Corresponding source$' "$ff/FFMPEG-BUILD.txt" || { echo '::error::FFMPEG-BUILD.txt has no Corresponding source section'; exit 1; }
          sed -n '1,/^ffmpeg -version$/p' "$ff/FFMPEG-BUILD.txt"

      # Launches the AppImage twice, the two ways users can run it: mounted with FUSE (the default; skipped with a warning
      # when libfuse2 could not be installed, see System packages) and with --appimage-extract-and-run (no FUSE needed).
      # Each run must serve byte ranges over recut-media:// (206), encode and probe a clip with the FFmpeg inside the
      # AppImage (its path must be the AppImage's resources/ffmpeg, never one on PATH: the run starts outside the checkout
      # with the checkout's FFmpeg off PATH), ship the FFmpeg licence files, start the OCR worker from app.asar.unpacked,
      # run the AppImage's own speech-to-text engine (resources/whisper/whisper-cli --version) and mount the UI. The smoke
      # file is the AppImage itself.
      - name: Smoke-test the AppImage
        run: |
          set +e -uo pipefail   # the runner starts bash with -e; each run's result is checked below instead
          app="$(ls "$GITHUB_WORKSPACE"/release/ReCut-*-linux-x86_64.AppImage)"
          chmod +x "$app"
          ls -la "$app"
          cd "$RUNNER_TEMP"
          bad=0
          modes='mounted extracted'
          if [ "${APPIMAGE_FUSE:-0}" != 1 ]; then modes='extracted'; echo '::warning::no libfuse2: smoke-testing the extracted AppImage only'; fi
          for mode in $modes; do
            out="$RUNNER_TEMP/smoke-$mode.txt"
            args=(--no-sandbox)
            if [ "$mode" = extracted ]; then args=(--appimage-extract-and-run --no-sandbox); fi
            echo "::group::AppImage smoke test ($mode)"
            RECUT_SMOKE=1 RECUT_SMOKE_OUT="$out" RECUT_SMOKE_FILE="$app" RECUT_USER_DATA="$RUNNER_TEMP/ud-$mode" \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              timeout 180 xvfb-run -a "$app" "${args[@]}"
            rc=$?
            echo '::endgroup::'
            if [ "$rc" -eq 124 ]; then echo "::error::AppImage smoke test ($mode) timed out"; bad=1; continue; fi
            echo "--- smoke ($mode), exit $rc"
            cat "$out" || { echo "::error::AppImage smoke test ($mode) wrote no results"; bad=1; continue; }
            if grep -E 'FAILED|layout=MISSING' "$out"; then echo "::error::AppImage smoke test ($mode) reported a failure"; bad=1; fi
            for want in \
              'smoke: protocol status=206 ' \
              'smoke: ffmpeg path=[^ ]*/(\.mount_[^/ ]+|appimage_extracted_[^/ ]+)/resources/ffmpeg/ffmpeg ffprobe path=[^ ]*/resources/ffmpeg/ffprobe ' \
              'smoke: ffmpeg encode\+probe ok ' \
              'smoke: licences shipped=[^ ]*FFMPEG-BUILD\.txt,FFMPEG-LICENSE\.txt' \
              'smoke: ocr core=(relaxedsimd-lstm|lstm) ok worker=.*app\.asar\.unpacked' \
              'smoke: whisper engine=[0-9.]+ ok path=[^ ]*/(\.mount_[^/ ]+|appimage_extracted_[^/ ]+)/resources/whisper/whisper-cli$' \
              'smoke: window loaded=.* layout=mounted'; do
              grep -qE "$want" "$out" || { echo "::error::AppImage smoke test ($mode): no line matching: $want"; bad=1; }
            done
          done
          exit "$bad"

      # Kept 14 days like ReCut-windows. The artifact root is release/, so downloading it into release/ restores
      # release/ReCut-<version>-linux-x86_64.AppImage for the publish job. (An artifact download does not keep the
      # executable bit; users chmod +x the file anyway.)
      - uses: actions/upload-artifact@v4
        with:
          name: ReCut-linux
          path: release/ReCut-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Linux build summary
        run: |
          f="$(basename "$(ls release/ReCut-*-linux-x86_64.AppImage)")"
          {
            echo "**Linux AppImage: \`$f\` is in this run's Artifacts (ReCut-linux).**"
            echo ''
            echo 'It passed the unit tests, the end-to-end tests and the AppImage smoke test on ubuntu-22.04. On a release run the publish job also attaches it to the release; otherwise it is a test build, kept for 14 days: use it only if the required jobs of this run (installer, tests, e2e, launcher, linux, macos, macos-e2e) are green. Run it with `chmod +x` and `./'"$f"'` (needs libfuse2, or add `--appimage-extract-and-run`).'
          } >> "$GITHUB_STEP_SUMMARY"

  # The macOS release gate (docs/ROADMAP.md §19): unit tests on macOS, the dmg with a bundled FFmpeg
  # (scripts/mac/get-ffmpeg.sh) and speech-to-text engine (scripts/mac/get-whisper.sh), the code-signature checks, and
  # a smoke test of the app inside the mounted dmg. Required like the Windows and Linux gates: the publish job needs
  # both legs and attaches both dmgs, so a red macOS leg stops the release. macos-14 is an Apple Silicon runner; the
  # bundled FFmpeg needs macOS 12 or newer (build.mac.minimumSystemVersion).
  #
  # Two downloads, one matrix leg each (owner's decision): ReCut-<version>-macos-arm64.dmg (Apple Silicon) and
  # ReCut-<version>-macos-x64.dmg (Intel), both macOS 12+, each bundling only its own arch's FFmpeg and speech-to-text
  # engine (no universal binary). Both legs run on the same Apple Silicon runner: the x64 leg cross-compiles
  # whisper.cpp and runs every x86_64 program (FFmpeg, whisper-cli, the unit tests' encodes, the app in the smoke test)
  # under Rosetta 2. Nothing here runs on Intel hardware.
  #
  # Signing is conditional on the repository secrets (docs/MACOS-SIGNING.md):
  #   - none of them set: an ad-hoc signed test build (no Apple account involved; Gatekeeper asks users to allow it in
  #     System Settings > Privacy & Security). CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder away from any
  #     keychain identity, and the hardened runtime is off because it rejects ad-hoc signed frameworks.
  #   - all five set (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER): electron-builder
  #     signs every Mach-O in ReCut.app (Electron, its helpers, the bundled ffmpeg / ffprobe) with the Developer ID
  #     certificate, the hardened runtime and a secure timestamp, notarizes the app with the App Store Connect API key
  #     and staples the ticket; the job then checks codesign, spctl and the stapled ticket.
  #   - only some set: the job fails (a half-configured signing setup is a mistake, not a test build).
  # A release is always signed. On a release run (decided by the "Release run?" step exactly as the installer job's
  # "Release metadata" step decides it; this job runs in parallel with that one, so it decides again) the job fails
  # in its first steps unless all five secrets are set, and later unless the app was Developer ID signed, notarized
  # and stapled. Only test builds may be ad-hoc signed. If the two decisions ever differ because v<version> was tagged
  # between them, the publish job's final tag re-check publishes nothing (the tag then exists).
  # Secrets are only ever passed through env and never printed. GitHub does not give secrets to pull requests from
  # forks, and this workflow does not run on pull requests at all. The same five secrets sign both dmgs.
  macos:
    name: macOS ${{ matrix.arch }} dmg + smoke test
    runs-on: macos-14
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        include:
          # lipo: the arch name lipo -archs prints; platform: the "Platform:" line of FFMPEG-BUILD.txt.
          - arch: arm64
            lipo: arm64
            platform: arm64 macOS
            label: Apple Silicon
          - arch: x64
            lipo: x86_64
            platform: x86-64 macOS
            label: Intel
    env:
      MAC_ARCH: ${{ matrix.arch }}
      LIPO_ARCH: ${{ matrix.lipo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Whether this run publishes a release, decided as the installer job's "Release metadata" step decides it: a push
      # of a vX.Y.Z or vX.Y.Z-rc.N tag (the installer job fails a tag that does not match package.json), or a push to
      # main whose package.json version has a non-empty "## [<version>]" CHANGELOG.md section and no v<version> tag
      # on origin. A release candidate (1.0.0-rc.1, section "## [1.0.0-rc.1]") is a release here like any other, so
      # it must be signed and notarized too.
      # A release must be signed, so a release run without all five signing secrets fails here, before anything is
      # built. The HAVE_* values are 'true' or 'false' (whether the secret is set), never the secrets themselves.
      - name: Release run? (a release must be signed)
        id: rel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          HAVE_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAVE_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAVE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAVE_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAVE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          set -euo pipefail
          # "<version> <true|false>": whether CHANGELOG.md has a non-empty "## [<version>]" section (up to the next
          # "## [" heading or link-reference line), as Get-ChangelogSection in the installer job reads it.
          read -r v section < <(node -e '
            const fs = require("fs");
            const v = require("./package.json").version;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const head = new RegExp("^## \\[" + v.split(".").join("\\.") + "\\](\\s|$)");
            const start = lines.findIndex((l) => head.test(l));
            let found = false;
            if (start >= 0) {
              for (const l of lines.slice(start + 1)) {
                if (/^## \[/.test(l) || /^\[[^\]]+\]:\s/.test(l)) break;
                if (l.trim()) { found = true; break; }
              }
            }
            console.log(v + " " + found);
          ') || { echo '::error::could not read the version from package.json or CHANGELOG.md'; exit 1; }
          release=false
          if [ "$REF_TYPE" = tag ]; then
            release=true
          elif [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ] && [ "$section" = true ]; then
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/v$v" || rc=$?
            if [ "$rc" -eq 2 ]; then
              release=true
            elif [ "$rc" -ne 0 ]; then
              echo "::error::git ls-remote failed (exit $rc) while checking whether tag v$v exists."
              exit 1
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" != true ]; then
            echo "Test build of $v: the dmg is signed and notarized if the signing secrets are set, ad-hoc signed otherwise."
            exit 0
          fi
          missing=''
          for s in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            h="HAVE_$s"
            if [ "${!h}" != true ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::This run releases v$v, and a release must be signed and notarized, but these macOS signing secrets are not set:$missing. Set all five (docs/MACOS-SIGNING.md), then re-run the failed jobs."
            exit 1
          fi
          echo "Release run (v$v): the dmg must be Developer ID signed, notarized and stapled, or this job fails."

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

      # The x64 leg runs x86_64 programs on this Apple Silicon runner: Rosetta 2 must be installed.
      - name: Rosetta 2
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo 'Rosetta 2 is not installed: installing it.'
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true || { echo '::error::Rosetta 2 cannot run x86_64 programs on this runner'; exit 1; }
          echo "Rosetta 2 ok: arch -x86_64 uname -m says $(arch -x86_64 /usr/bin/uname -m)"

      # The same build is bundled into ReCut.app (resources/ffmpeg -> Contents/Resources/ffmpeg) and put on PATH for
      # the unit tests. The script runs both programs (H.264 / AAC, H.265 and a burned-in subtitle) before it succeeds.
      - name: Download FFmpeg to bundle (and put it on PATH)
        run: |
          ./scripts/mac/get-ffmpeg.sh --arch "$MAC_ARCH" --dest resources/ffmpeg
          echo "$GITHUB_WORKSPACE/resources/ffmpeg" >> "$GITHUB_PATH"

      # The speech-to-text engine, bundled into ReCut.app (resources/whisper -> Contents/Resources/whisper) and signed
      # with it: arm64 is one static binary with Metal; x64 is CPU only, cross-compiled for x86_64, with the CPU-variant
      # kernels ggml picks from at run time. Built from the pinned, hash-checked source; cached per arch, pinned source
      # and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-macos-${{ matrix.arch }}-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/mac/get-whisper.sh') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          JOBS="$(sysctl -n hw.ncpu)" NICE=0 ./scripts/mac/get-whisper.sh --arch "$MAC_ARCH" --dest resources/whisper

      # For x64 the tests run FFmpeg and whisper-cli (the real engine with a generated model) under Rosetta 2.
      - name: Unit tests
        run: npx vitest run

      - run: npm run build

      # Decides signed or unsigned and writes the notarization key to a private temp file. Prints only which mode.
      # A release run never gets here unsigned ("Release run?" fails first); checked again here all the same.
      - name: Code signing setup
        id: sign
        env:
          RELEASE: ${{ steps.rel.outputs.release }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          have=0
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -n "${!v:-}" ]; then have=$((have + 1)); fi
          done
          if [ "$have" -eq 0 ] && [ "$RELEASE" = true ]; then
            echo '::error::This run is a release, and a release must be signed and notarized, but no macOS signing secrets are set (docs/MACOS-SIGNING.md).'
            exit 1
          fi
          if [ "$have" -eq 0 ]; then
            echo 'No macOS signing secrets: building an ad-hoc signed test build (not notarized).'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$have" -ne 5 ]; then
            echo "::error::Only $have of the 5 macOS signing secrets are set (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER). Set all five or none; see docs/MACOS-SIGNING.md."
            exit 1
          fi
          dir="$RUNNER_TEMP/recut-notary"
          mkdir -p "$dir"
          chmod 700 "$dir"
          key="$dir/AuthKey.p8"
          umask 077
          # The secret holds the .p8 file base64-encoded (docs/MACOS-SIGNING.md); its plain PEM text is accepted too.
          if printf '%s' "$APPLE_API_KEY_B64" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY_B64" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key" 2>/dev/null || { echo '::error::APPLE_API_KEY is not valid base64.'; exit 1; }
          fi
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo '::error::APPLE_API_KEY does not decode to an App Store Connect .p8 key file.'; exit 1; }
          echo 'All five macOS signing secrets are set: building a Developer ID signed, notarized build.'
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          echo "key_path=$key" >> "$GITHUB_OUTPUT"

      - name: Package the dmg
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          CSC_LINK: ${{ steps.sign.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_PATH: ${{ steps.sign.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ steps.sign.outputs.signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.sign.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            # electron-builder imports CSC_LINK into a temporary keychain, signs with the Developer ID Application
            # identity in it, then notarizes and staples because APPLE_API_KEY / _ID / _ISSUER are set.
            APPLE_API_KEY="$APPLE_API_KEY_PATH" npx electron-builder --mac dmg "--$MAC_ARCH" --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            # Ad-hoc signature (identity "-"), no secure timestamp (Apple's timestamp server only stamps Developer ID
            # signatures), hardened runtime off. --no-config.mac.hardenedRuntime is how the CLI sets a boolean false
            # (-c.mac.hardenedRuntime=false would pass the string "false", which counts as on).
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg "--$MAC_ARCH" --publish never \
              -c.mac.identity=- -c.mac.timestamp=none --no-config.mac.hardenedRuntime
          fi
          rm -rf "$RUNNER_TEMP/recut-notary"
          ls -la release

      # Same budget as the Windows and Linux jobs: the OCR worker and the LSTM-only Tesseract cores are unpacked from
      # app.asar and fit 7 MB, and tesseract.js / tesseract.js-core are not in app.asar. (BSD find and stat.)
      - name: OCR packaging budget
        run: |
          set -euo pipefail
          # electron-builder's app folder: release/mac-arm64 for arm64, release/mac for x64.
          if [ "$MAC_ARCH" = arm64 ]; then appdir=release/mac-arm64; else appdir=release/mac; fi
          res="$appdir/ReCut.app/Contents/Resources"
          test -d "$res" || { echo "::error::no $res"; ls -la release; exit 1; }
          dir="$res/app.asar.unpacked/dist/electron/ocr"
          test -f "$dir/worker.js" || { echo "::error::OCR worker is not unpacked: $dir/worker.js"; exit 1; }
          find "$dir" -type f -exec stat -f '%12z  %N' {} +
          bytes=$(find "$dir" -type f -exec stat -f '%z' {} + | awk '{ s += $1 } END { print s + 0 }')
          echo "OCR folder: $bytes bytes (budget 7 MB)"
          if [ "$bytes" -gt $((7 * 1024 * 1024)) ]; then echo "::error::OCR folder is $bytes bytes, over the 7 MB budget"; exit 1; fi
          npx asar list "$res/app.asar" > "$RUNNER_TEMP/asar-list.txt"
          test -s "$RUNNER_TEMP/asar-list.txt" || { echo '::error::npx asar list failed'; exit 1; }
          if grep -E '/node_modules/tesseract\.js(-core)?(/|$)' "$RUNNER_TEMP/asar-list.txt" > "$RUNNER_TEMP/asar-bad.txt"; then
            head -n 10 "$RUNNER_TEMP/asar-bad.txt"; echo '::error::app.asar contains tesseract.js or tesseract.js-core'; exit 1
          fi
          echo "app.asar: $(wc -l < "$RUNNER_TEMP/asar-list.txt" | tr -d ' ') entries, no tesseract.js / tesseract.js-core"

      # Mounted read-only, as users open it. The next steps check the app inside the dmg, not the build folder.
      - name: Mount the dmg
        id: dmg
        run: |
          set -euo pipefail
          dmg="$(ls "$GITHUB_WORKSPACE"/release/ReCut-*-macos-"$MAC_ARCH".dmg)"
          ls -la "$dmg"
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/recut-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          test -d "$mnt/ReCut.app" || { echo '::error::ReCut.app is not in the dmg'; exit 1; }
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "app=$mnt/ReCut.app" >> "$GITHUB_OUTPUT"

      # The FFmpeg folder inside the app: both programs (this arch only), the licence and the build record.
      - name: Bundled FFmpeg files
        env:
          APP: ${{ steps.dmg.outputs.app }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ff="$APP/Contents/Resources/ffmpeg"
          ls -la "$ff"
          for f in ffmpeg ffprobe; do
            test -x "$ff/$f" || { echo "::error::$ff/$f is missing or not executable"; exit 1; }
            got="$(lipo -archs "$ff/$f")"
            [ "$got" = "$LIPO_ARCH" ] || { echo "::error::$ff/$f is $got, not $LIPO_ARCH only"; exit 1; }
          done
          for f in FFMPEG-LICENSE.txt FFMPEG-BUILD.txt; do test -s "$ff/$f" || { echo "::error::$ff/$f is missing or empty"; exit 1; }; done
          grep -qx "Platform: *$PLATFORM" "$ff/FFMPEG-BUILD.txt" || { echo "::error::FFMPEG-BUILD.txt does not name the $PLATFORM platform"; exit 1; }
          grep -q "_portable_$([ "$MAC_ARCH" = arm64 ] && echo macarm64 || echo mac64)-gpl" "$ff/FFMPEG-BUILD.txt" || { echo "::error::FFMPEG-BUILD.txt does not name the $MAC_ARCH Jellyfin build"; exit 1; }
          grep -q '^Corresponding source$' "$ff/FFMPEG-BUILD.txt" || { echo '::error::FFMPEG-BUILD.txt has no Corresponding source section'; exit 1; }
          if grep -q 'NOT RUN' "$ff/FFMPEG-BUILD.txt"; then echo '::error::the bundled FFmpeg was fetched with --skip-run'; exit 1; fi
          sed -n '1,/^ffmpeg -version$/p' "$ff/FFMPEG-BUILD.txt"

      # The speech-to-text engine inside the app, its licence and build record, within the 16 MB budget, and no model.
      # arm64: one whisper-cli with the Metal library embedded. x64: whisper-cli, its dylibs and the five CPU-variant
      # kernels, no Metal. Every Mach-O file in the folder must be this arch only.
      - name: Bundled speech-to-text engine
        env:
          APP: ${{ steps.dmg.outputs.app }}
        run: |
          set -euo pipefail
          w="$APP/Contents/Resources/whisper"
          ls -la "$w"
          test -x "$w/whisper-cli" || { echo "::error::$w/whisper-cli is missing or not executable"; exit 1; }
          for f in "$w"/*; do
            case "$(file -b "$f")" in Mach-O*) ;; *) continue ;; esac
            got="$(lipo -archs "$f")"
            [ "$got" = "$LIPO_ARCH" ] || { echo "::error::$f is $got, not $LIPO_ARCH only"; exit 1; }
          done
          for f in WHISPER-LICENSE.txt WHISPER-BUILD.txt; do test -s "$w/$f" || { echo "::error::$w/$f is missing or empty"; exit 1; }; done
          if [ "$MAC_ARCH" = arm64 ]; then
            grep -q 'GGML_METAL_EMBED_LIBRARY=ON' "$w/WHISPER-BUILD.txt" || { echo '::error::the Metal library is not embedded'; exit 1; }
          else
            grep -q 'GGML_METAL=OFF' "$w/WHISPER-BUILD.txt" || { echo '::error::the x64 engine is not a CPU-only build'; exit 1; }
            grep -q 'GGML_CPU_ALL_VARIANTS=ON' "$w/WHISPER-BUILD.txt" || { echo '::error::the x64 engine was not built with the CPU variants'; exit 1; }
            for v in x64 sse42 sandybridge haswell skylakex; do
              test -f "$w/libggml-cpu-$v.so" || { echo "::error::$w/libggml-cpu-$v.so is missing"; exit 1; }
            done
            if ls "$w"/*.metal* >/dev/null 2>&1; then echo '::error::a Metal file is in the x64 engine'; exit 1; fi
          fi
          if ls "$w"/*.bin >/dev/null 2>&1; then echo '::error::a model file is in the package'; exit 1; fi
          bytes=$(find "$w" -type f -exec stat -f '%z' {} + | awk '{ s += $1 } END { print s + 0 }')
          echo "Speech-to-text engine: $bytes bytes (budget 16 MB)"
          if [ "$bytes" -gt $((16 * 1024 * 1024)) ]; then echo "::error::the speech-to-text engine is $bytes bytes, over the 16 MB budget"; exit 1; fi
          sed -n '1,12p' "$w/WHISPER-BUILD.txt"

      # Every Mach-O file in the app must carry a valid signature: ad-hoc for a test build; for a signed build the
      # Developer ID, the hardened runtime and a secure timestamp (notarization rejects anything else), plus
      # Gatekeeper's verdict and the stapled notarization ticket. A release run must be a signed build.
      - name: Code signature
        env:
          APP: ${{ steps.dmg.outputs.app }}
          SIGNED: ${{ steps.sign.outputs.signed }}
          RELEASE: ${{ steps.rel.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ] && [ "$SIGNED" != true ]; then
            echo '::error::This run is a release, and a release must be Developer ID signed and notarized, but this dmg is not.'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          n=0; bad=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in Mach-O*) ;; *) continue ;; esac
            n=$((n + 1))
            info="$(codesign -dvvv "$f" 2>&1)" || { echo "::error::not signed: $f"; bad=1; continue; }
            if [ "$SIGNED" = true ]; then
              grep -q '^Authority=Developer ID Application: ' <<<"$info" || { echo "::error::not signed with a Developer ID: $f"; bad=1; }
              grep -qE '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<<"$info" || { echo "::error::no hardened runtime: $f"; bad=1; }
              grep -q '^Timestamp=' <<<"$info" || { echo "::error::no secure timestamp: $f"; bad=1; }
            else
              grep -q '^Signature=adhoc' <<<"$info" || { echo "::error::not ad-hoc signed: $f"; bad=1; }
            fi
          done < <(find "$APP" -type f -print0)
          echo "Mach-O files checked: $n"
          if [ "$n" -lt 5 ]; then echo "::error::found only $n Mach-O files in ReCut.app"; bad=1; fi
          codesign -dvv "$APP/Contents/Resources/ffmpeg/ffmpeg" 2>&1 | grep -E '^(Identifier|Authority|Signature|Timestamp|TeamIdentifier|CodeDirectory)' || true
          if [ "$SIGNED" = true ]; then
            spctl -a -vv -t exec "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
            grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || { echo '::error::Gatekeeper does not accept the app as a notarized Developer ID app'; bad=1; }
            xcrun stapler validate "$APP" || { echo '::error::no valid stapled notarization ticket'; bad=1; }
          else
            echo 'Unsigned test build: spctl and stapler checks skipped (they need the Developer ID and notarization).'
          fi
          exit "$bad"

      # Launches ReCut from the mounted dmg. It must serve byte ranges over recut-media:// (206), encode and probe a
      # clip with the FFmpeg inside the app (its path must be the dmg's ReCut.app/Contents/Resources/ffmpeg, never one
      # on PATH: the run starts outside the checkout with a system-only PATH), ship the FFmpeg licence files, start the
      # OCR worker from app.asar.unpacked and mount the UI. The smoke file is the dmg itself. macOS has no `timeout`,
      # so the limit is a wait loop: 180 s, or 360 s for x64, whose first launch under Rosetta 2 translates Electron.
      # The x64 app is x86_64 only (checked first), so on this Apple Silicon runner it can only run under Rosetta 2.
      - name: Smoke-test the app in the dmg
        env:
          APP: ${{ steps.dmg.outputs.app }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set +e -uo pipefail   # the result is checked below instead
          for f in "$APP/Contents/MacOS/ReCut" "$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"; do
            got="$(lipo -archs "$f")"
            [ "$got" = "$LIPO_ARCH" ] || { echo "::error::$f is $got, not $LIPO_ARCH only"; exit 1; }
          done
          limit=180
          if [ "$MAC_ARCH" = x64 ]; then limit=360; fi
          out="$RUNNER_TEMP/smoke-dmg.txt"
          cd "$RUNNER_TEMP"
          RECUT_SMOKE=1 RECUT_SMOKE_OUT="$out" RECUT_SMOKE_FILE="$DMG" RECUT_USER_DATA="$RUNNER_TEMP/ud-dmg" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin "$APP/Contents/MacOS/ReCut" &
          pid=$!
          waited=0
          while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$limit" ]; do sleep 1; waited=$((waited + 1)); done
          echo "--- smoke (dmg, $MAC_ARCH) took ${waited} s"
          if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid"; echo '::error::macOS smoke test timed out'; exit 1; fi
          wait "$pid"
          rc=$?
          echo "--- smoke (dmg), exit $rc"
          bad=0
          cat "$out" || { echo '::error::macOS smoke test wrote no results'; exit 1; }
          if grep -E 'FAILED|layout=MISSING' "$out"; then echo '::error::macOS smoke test reported a failure'; bad=1; fi
          for want in \
            'smoke: protocol status=206 ' \
            'smoke: ffmpeg path=[^ ]*/recut-dmg/ReCut\.app/Contents/Resources/ffmpeg/ffmpeg ffprobe path=[^ ]*/recut-dmg/ReCut\.app/Contents/Resources/ffmpeg/ffprobe ' \
            'smoke: ffmpeg encode\+probe ok ' \
            'smoke: licences shipped=[^ ]*FFMPEG-BUILD\.txt,FFMPEG-LICENSE\.txt' \
            'smoke: ocr core=(relaxedsimd-lstm|lstm) ok worker=.*app\.asar\.unpacked' \
            'smoke: whisper engine=[0-9.]+ ok path=[^ ]*/recut-dmg/ReCut\.app/Contents/Resources/whisper/whisper-cli$' \
            'smoke: window loaded=.* layout=mounted'; do
            grep -qE "$want" "$out" || { echo "::error::macOS smoke test: no line matching: $want"; bad=1; }
          done
          exit "$bad"

      - name: Unmount the dmg
        if: always() && steps.dmg.outputs.app != ''
        run: hdiutil detach "$RUNNER_TEMP/recut-dmg" -force || true

      # Kept 14 days like ReCut-windows and ReCut-linux. One artifact per arch, ReCut-macos-arm64 and ReCut-macos-x64;
      # the artifact root is release/, so downloading both into release/ restores release/ReCut-<version>-macos-arm64.dmg
      # and release/ReCut-<version>-macos-x64.dmg for the publish job.
      - uses: actions/upload-artifact@v4
        with:
          name: ReCut-macos-${{ matrix.arch }}
          path: release/ReCut-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: macOS build summary
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          LABEL: ${{ matrix.label }}
        run: |
          f="$(basename "$(ls release/ReCut-*-macos-"$MAC_ARCH".dmg)")"
          if [ "$SIGNED" = true ]; then
            how='It is signed with a Developer ID and notarized: it opens without a Gatekeeper warning.'
          else
            how='It is an unsigned (ad-hoc signed) test build: on first launch macOS refuses to open it; allow it under System Settings › Privacy & Security › Open Anyway (docs/INSTALL.md).'
          fi
          if [ "$MAC_ARCH" = x64 ]; then where='on macos-14 (Apple Silicon) under Rosetta 2; it has not run on an Intel Mac'; else where='on macos-14'; fi
          {
            echo "**macOS dmg ($LABEL): \`$f\` is in this run's Artifacts (ReCut-macos-$MAC_ARCH).**"
            echo ''
            echo "It passed the unit tests, the code-signature checks and the smoke test of the app inside the mounted dmg $where. $how On a release run the publish job also attaches it to the release; otherwise it is a test build, kept for 14 days: use it only if the required jobs of this run (installer, tests, e2e, launcher, linux, macos, macos-e2e) are green."
          } >> "$GITHUB_STEP_SUMMARY"

  # The end-to-end suite on macOS, a release gate like the macos job (publish needs it). A separate job so that a test
  # that assumes Windows / Linux behaviour (for example a Control+ shortcut that is Cmd+ on macOS) shows up here
  # without hiding the packaging and smoke results of the macos job. GitHub's macOS runners have a
  # logged-in desktop session, so Electron opens real windows; no xvfb is needed.
  macos-e2e:
    name: End-to-end tests on macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Put FFmpeg on PATH
        run: |
          ./scripts/mac/get-ffmpeg.sh --dest "$RUNNER_TEMP/ff"
          echo "$RUNNER_TEMP/ff" >> "$GITHUB_PATH"
      # tests/e2e/whisper.spec.ts transcribes with the engine the app finds in resources/whisper.
      # arm64 only: the end-to-end suite runs natively on this Apple Silicon runner (the x64 dmg is smoke-tested under
      # Rosetta 2 in the macos job, not end-to-end tested).
      # The speech-to-text engine (whisper.cpp, Metal, one static arm64 binary), bundled into ReCut.app
      # (resources/whisper -> Contents/Resources/whisper) and signed with it. Built from the pinned, hash-checked source;
      # cached per pinned source and build script, so a cache hit skips the compile.
      - name: Speech-to-text engine cache
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-macos-arm64-${{ hashFiles('scripts/whisper-source.mjs', 'scripts/mac/get-whisper.sh') }}
      - name: Build the speech-to-text engine (whisper.cpp)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          JOBS="$(sysctl -n hw.ncpu)" NICE=0 ./scripts/mac/get-whisper.sh --dest resources/whisper
      - run: npm run build
      - run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-macos
          path: test-results/

  # The only job that publishes, and it only ever publishes a real release: vX.Y.Z (marked Latest) or a release
  # candidate vX.Y.Z-rc.N (marked pre-release, never Latest); never a dev prerelease. It runs
  # only when the installer job decided this run is a release (automatic on main, or the tag-push fallback); a test
  # build skips it. It needs every required gate (macos means both matrix legs, arm64 and x64) and has no
  # always()/failure()/cancelled() in its if:, so the implicit success() applies: if installer, tests, e2e, launcher,
  # linux, either macos leg or macos-e2e failed, was cancelled or was skipped, this job is skipped and nothing is
  # published (no release, no tag). On a release run a macos leg succeeds only with a Developer ID signed, notarized
  # and stapled app, so both dmgs attached here are signed.
  publish:
    name: Publish GitHub Release
    needs: [installer, tests, e2e, launcher, linux, macos, macos-e2e]
    if: needs.installer.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # The checkout leaves credentials in the git config for git ls-remote in the final release check.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReCut-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ReCut-linux
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ReCut-macos-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ReCut-macos-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      # Exactly the five files the release attaches, each named for the version being released (the tag without its
      # "v", pre-release part included: ReCut-Setup-1.0.0-rc.1.exe for v1.0.0-rc.1): a missing or empty file, a second
      # match or a file of another version fails the run before anything is published.
      - name: Release files
        shell: pwsh
        env:
          TAG: ${{ needs.installer.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -cmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$') { $v = $Matches[1] }
          else { Write-Host "::error::Refusing to publish '$env:TAG': only vMAJOR.MINOR.PATCH releases and vMAJOR.MINOR.PATCH-PRERELEASE release candidates are published."; exit 1 }
          $bad = 0
          foreach ($want in @(
              @{ glob = 'ReCut-Setup-*.exe'; name = "ReCut-Setup-$v.exe" },
              @{ glob = 'ReCut-Portable-*.exe'; name = "ReCut-Portable-$v.exe" },
              @{ glob = 'ReCut-*-linux-x86_64.AppImage'; name = "ReCut-$v-linux-x86_64.AppImage" },
              @{ glob = 'ReCut-*-macos-arm64.dmg'; name = "ReCut-$v-macos-arm64.dmg" },
              @{ glob = 'ReCut-*-macos-x64.dmg'; name = "ReCut-$v-macos-x64.dmg" })) {
            $found = @(Get-ChildItem -File -Path release | Where-Object { $_.Name -like $want.glob })
            if ($found.Count -ne 1 -or $found[0].Name -cne $want.name -or $found[0].Length -eq 0) {
              $list = ($found | ForEach-Object { "$($_.Name) ($($_.Length) bytes)" }) -join ', '
              Write-Host "::error::Expected exactly one non-empty release/$($want.name); found: $(if ($list) { $list } else { 'none' })"
              $bad = 1
            } else {
              Write-Host ('{0,14:N0}  {1}' -f $found[0].Length, $found[0].Name)
            }
          }
          exit $bad

      # An automatic release re-checks its tag right before publishing. If v<version> appeared while this run was
      # building (someone pushed the tag or made the release by hand), the version is already released: the job
      # logs a warning, publishes nothing, leaves that release alone and succeeds. The tag-push fallback passes
      # through unchanged (its tag exists by definition). It also decides pre-release / Latest from the tag itself and
      # refuses to publish when that disagrees with the installer job's prerelease output.
      - name: Final release check
        id: pub
        shell: pwsh
        env:
          AUTO: ${{ needs.installer.outputs.auto }}
          PRERELEASE: ${{ needs.installer.outputs.prerelease }}
          TAG: ${{ needs.installer.outputs.tag }}
          NAME: ${{ needs.installer.outputs.name }}
          NOTES: ${{ runner.temp }}/release-notes/${{ needs.installer.outputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') { Write-Host "::error::Refusing to publish '$env:TAG': only vMAJOR.MINOR.PATCH releases and vMAJOR.MINOR.PATCH-PRERELEASE release candidates are published."; exit 1 }
          # A tag with a pre-release part is a pre-release and never Latest; a plain vX.Y.Z is a full release, Latest.
          $prerelease = if ($env:TAG.Contains('-')) { 'true' } else { 'false' }
          $latest = if ($prerelease -eq 'true') { 'false' } else { 'true' }
          if ($env:PRERELEASE -cne $prerelease) { Write-Host "::error::Tag $env:TAG means prerelease=$prerelease, but the installer job decided prerelease='$env:PRERELEASE'. Publishing nothing."; exit 1 }
          $publish = 'true'
          if ($env:AUTO -eq 'true') {
            git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" | Out-Host
            $rc = $LASTEXITCODE; $global:LASTEXITCODE = 0
            if ($rc -eq 0) {
              Write-Host "::warning::Tag $env:TAG was created while this run was building: $env:TAG is already released. Publishing nothing."
              $publish = 'false'
            } elseif ($rc -ne 2) {
              Write-Host "::error::git ls-remote failed (exit $rc) while re-checking tag $env:TAG."; exit 1
            }
          }
          if ($publish -eq 'true') {
            if ($prerelease -eq 'true') { Write-Host "Publishing: $env:NAME (tag $env:TAG, pre-release, not marked Latest)" }
            else { Write-Host "Publishing: $env:NAME (tag $env:TAG, marked Latest)" }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value @("publish=$publish", "tag=$env:TAG", "name=$env:NAME", "notes=$env:NOTES",
            "prerelease=$prerelease", "make_latest=$latest")
          exit 0

      # softprops creates the tag (with GITHUB_TOKEN, on target_commitish = the commit this run built) when it does
      # not exist yet. That is how an automatic release gets its v<version> tag on the release PR's merge commit.
      # A full release is marked Latest; a release candidate (tag vX.Y.Z-<pre>) is a pre-release and make_latest is
      # 'false', so the Latest release and GitHub's releases/latest (the update notice of stable users) stay on the
      # newest stable version.
      - name: Publish GitHub Release
        if: steps.pub.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pub.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.pub.outputs.name }}
          prerelease: ${{ steps.pub.outputs.prerelease }}
          make_latest: ${{ steps.pub.outputs.make_latest }}
          body_path: ${{ steps.pub.outputs.notes }}
          files: |
            release/ReCut-Setup-*.exe
            release/ReCut-Portable-*.exe
            release/ReCut-*-linux-x86_64.AppImage
            release/ReCut-*-macos-arm64.dmg
            release/ReCut-*-macos-x64.dmg
